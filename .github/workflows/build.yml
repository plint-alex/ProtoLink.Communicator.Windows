name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore ProtoLink.Communicator.Windows.sln

      - name: Build
        run: dotnet build ProtoLink.Communicator.Windows.sln --configuration Release --no-restore -warnaserror

      - name: Test (Offline only)
        run: dotnet test ProtoLink.Communicator.Windows.IntegrationTests --configuration Release --no-build --verbosity normal --filter "Category=Offline"
